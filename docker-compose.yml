# Production stack: Postgres + Django/Gunicorn + Nginx(React).
# Bring it up with:  docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      # Zibal payment gateway. These MUST be listed here: this service
      # enumerates its environment explicitly, so a variable present in .env but
      # absent from this list never reaches the container — and ZIBAL_MERCHANT
      # then falls back to its 'zibal' default, which is Zibal's shared TEST
      # account. The symptom is a payment page that simulates instead of asking
      # for a card, with no error anywhere: the test merchant is a valid
      # merchant, so the gateway accepts the request and the IP allowlist on the
      # real one never comes into play.
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT}
      ZIBAL_CALLBACK_BASE_URL: ${ZIBAL_CALLBACK_BASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"

  # Serves the SPA and reverse-proxies /api, /admin, /media and /static to the
  # backend over the docker network. The host port is bound to localhost only:
  # the public entry point is the host's own Nginx, which proxies
  # salyco.ir -> 127.0.0.1:8080 (see deploy/nginx/salyco.conf). Other apps on
  # the same server take 8081, 8082, ...
  frontend:
    build:
      context: ./Frontend/salyco-front
      args:
        # Empty => same-origin API calls, proxied by nginx to the backend.
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro

volumes:
  postgres_data:
  media_data:
  static_data:
