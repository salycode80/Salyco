# Nginx: serve the React SPA and reverse-proxy backend routes to Django.
# Everything is same-origin, so the browser never hits CORS.

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Allow large-ish uploads (product/article images).
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # ── API + auth ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django admin ────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── User-uploaded media ─────────────────────────────────────────────────
    # Served straight off the shared volume for speed.
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # ── Django/DRF/admin static (collectstatic output) ──────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Hashed asset filenames can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
