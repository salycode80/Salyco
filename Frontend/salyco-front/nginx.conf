# Nginx: serve the React SPA and reverse-proxy backend routes to Django.
# Everything is same-origin, so the browser never hits CORS.

upstream django {
    server backend:8000;
}

# Preserve the original protocol the host's Nginx saw (https). On the internal
# host-nginx → container-nginx hop $scheme is always "http", so fall back to it
# only when the proxy sent nothing.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ── Modern image negotiation ─────────────────────────────────────────────────
# scripts/gen_image_derivatives.py writes sibling files next to every raster
# source: foo.png.avif and foo.png.webp. This map picks the best format the
# browser advertises, and try_files falls back to the untouched original when
# the derivative is absent or the browser is old.
#
# Regex entries are evaluated top-down, so AVIF wins when a browser offers both.
# Chrome/Edge/Firefox/Safari 16+ all send image/avif; everything else gets webp
# or the original PNG. No JavaScript, no <picture> markup, no build step in the
# app itself.
map $http_accept $img_sfx {
    default        "";
    "~*image/avif" ".avif";
    "~*image/webp" ".webp";
}

server {
    listen 80;
    server_name _;

    # Allow large-ish uploads (product/article images).
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    # The JS bundle is ~610 KB uncompressed; gzip takes it to roughly a third of
    # that. Only text formats are listed -- PNG/JPEG/WebP/AVIF are already
    # entropy-coded and gzipping them wastes CPU for no gain.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # ── API + auth ──────────────────────────────────────────────────────────
    # ^~ so the image-negotiation regex below can never intercept an API path.
    location ^~ /api/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Django admin ────────────────────────────────────────────────────────
    location ^~ /admin/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── User-uploaded media ─────────────────────────────────────────────────
    # Served straight off the shared volume for speed. `root /app` (rather than
    # `alias`) keeps $uri intact so try_files works normally in the nested block.
    #
    # Cache-Control is set via add_header only -- `expires` emits its own
    # Cache-Control, and using both sends the header twice.
    location ^~ /media/ {
        root /app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;

        # Negotiated variants for raster images only. The types{} block is
        # complete for the extensions this location can serve, so declaring it
        # here cannot mask a MIME type used elsewhere.
        location ~* ^/media/.+\.(png|jpe?g)$ {
            access_log off;
            # add_header does not inherit into a nested location -- repeat it.
            add_header Cache-Control "public, max-age=2592000";
            add_header Vary Accept;
            types {
                image/avif avif;
                image/webp webp;
                image/png  png;
                image/jpeg jpg jpeg;
            }
            try_files $uri$img_sfx $uri =404;
        }
    }

    # ── Django/DRF/admin static (collectstatic output) ──────────────────────
    location ^~ /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Hashed build assets ─────────────────────────────────────────────────
    # Filenames carry a content hash, so these can be cached forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Static images shipped with the frontend ─────────────────────────────
    # Hero, logos, placeholders and bed icons from the Vite public/ directory.
    # Same negotiation as /media/, against the SPA document root.
    location ~* \.(png|jpe?g)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary Accept;
        types {
            image/avif avif;
            image/webp webp;
            image/png  png;
            image/jpeg jpg jpeg;
        }
        try_files $uri$img_sfx $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # index.html must not be cached, or a deploy leaves clients on stale asset
    # URLs until their cache expires.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
