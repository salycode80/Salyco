<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from public/logo3.png (the swan mark) by the favicon block in
         scripts/gen_image_derivatives.py's sibling recipe -- see
         .claude/salyco-improvement-plan.md 1.3. The old favicon pointed straight
         at logo3.png: a 1024x1024, 675 KB PNG downscaled by the browser on every
         page load. These are 711 B and 2.4 KB. The silver swan sits on brand
         navy because chrome-on-transparent disappears against a light tab bar. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003087" />
    <meta
      name="description"
      content="سالیکو — تولیدکننده تشک و محصولات خواب با بیش از دو دهه تجربه. تشک طبی و فنری با گارانتی معتبر."
    />
    <!-- Warm up the font connections before the CSS request is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 500 and 600 are loaded because the UI uses font-medium / font-semibold
         throughout. Without them the browser synthesises the weight, which
         renders Persian text noticeably blurrier than the real cut. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>سالیکو | تشک و محصولات خواب</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
