<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from public/logo3.png (the swan mark) by the favicon block in
         scripts/gen_image_derivatives.py's sibling recipe -- see
         .claude/salyco-improvement-plan.md 1.3. The old favicon pointed straight
         at logo3.png: a 1024x1024, 675 KB PNG downscaled by the browser on every
         page load. These are 711 B and 2.4 KB. The silver swan sits on brand
         navy because chrome-on-transparent disappears against a light tab bar. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on iOS.
         The mobile tab bar is fixed to the bottom edge, so without it the bar
         would sit under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#052E5F" />
    <!-- The palette. src/index.css maps Tailwind's names onto these variables
         rather than restating the hex values, so this stylesheet has to load
         before anything paints: an undefined custom property does not fall back
         to a default, it makes the declaration invalid, and the failure shows up
         as transparent or black surfaces rather than as an error. Django's
         article pages link the same file from their own template. -->
    <link rel="stylesheet" href="/tokens.css" />
    <meta
      name="description"
      content="سالیکو — تولیدکننده تشک و محصولات خواب با بیش از دو دهه تجربه. تشک طبی و فنری با گارانتی معتبر."
    />
    <!-- Self-hosted Vazirmatn font. Weights 400, 500, 600, and 700 are preloaded
         to avoid FOUT. The browser synthesizes weights without proper cuts,
         making Persian text noticeably blurrier, so we load the real cuts. -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <title>سالیکو | تشک و محصولات خواب</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
