# ─────────────────────────────────────────────────────────────────────────────
# Public entry point for salyco.ir on the Ubuntu host.
#
# Install on the server:
#   sudo cp salyco.conf /etc/nginx/sites-available/salyco.conf
#   sudo ln -s /etc/nginx/sites-available/salyco.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#
# TLS: this file starts as HTTP-only so it can go live while Caddy still owns
# 443. Once Caddy is stopped and this Nginx owns 80/443, run:
#   sudo certbot --nginx -d salyco.ir -d www.salyco.ir --redirect
# certbot rewrites this file into an HTTP→HTTPS redirect + a 443 server block,
# and renews the certificate automatically from then on (certbot.timer).
#
# Future apps on this server follow the same pattern on 8081, 8082, ...
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name salyco.ir www.salyco.ir;

    # Let's Encrypt HTTP-01 challenges, if certbot is run in webroot mode.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The container's nginx reads this to build absolute URLs (and the
        # Django admin's CSRF check depends on it staying https in production).
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must match the container nginx (product/article image uploads).
        client_max_body_size 25M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
